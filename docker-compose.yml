version: '3.8'

services:
  redis:
    image: redis:7-alpine
    # Nombre fijo — el backend está también en la red "coolify" compartida,
    # donde el Redis propio de Coolify se registra con el alias "redis" y
    # colisiona con el alias corto de este servicio (causaba NOAUTH: el
    # backend acababa hablando con el Redis de Coolify, que requiere
    # contraseña, en vez de con este). Referenciar el nombre completo evita
    # la ambigüedad pase lo que pase con el nombre del proyecto Compose.
    container_name: io-prospector-redis-1
    restart: unless-stopped
    networks:
      - default

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - FRONTEND_URL=http://localhost:3004,http://10.0.7.3:3004,https://pros.iorana.dev
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - REDIS_URL=redis://io-prospector-redis-1:6379
      - SERP_API_KEY=${SERP_API_KEY}
      - GOOGLE_PLACES_API_KEY=${GOOGLE_PLACES_API_KEY}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - PAGESPEED_API_KEY=${PAGESPEED_API_KEY}
      - AUDIT_QUEUE_CONCURRENCY=${AUDIT_QUEUE_CONCURRENCY:-2}
    depends_on:
      - redis
    restart: unless-stopped
    # Límite defensivo — cada auditoría lanza un Chromium headless; sin esto,
    # picos de tráfico o una página que consuma memoria de más podrían
    # arrastrar al resto de contenedores del VPS (mismo host, RAM compartida).
    # La defensa principal es AUDIT_QUEUE_CONCURRENCY (limita cuántos
    # Chromium corren en paralelo); esto es la red de seguridad adicional.
    mem_limit: 1024m
    cpus: 1.5
    networks:
      - coolify
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.io-prospector-api.rule=Host(`api.pros.iorana.dev`)"
      - "traefik.http.routers.io-prospector-api.entrypoints=https"
      - "traefik.http.routers.io-prospector-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.io-prospector-api-service.loadbalancer.server.port=4000"

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
      args:
        - NODE_ENV=production
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-https://zvehtloitnuglyjtxwye.supabase.co}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-sb_publishable_B0gQyDyf-p2vDg2UhytfDg_H54mWXbB}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - N8N_WHATSAPP_WEBHOOK_URL=${N8N_WHATSAPP_WEBHOOK_URL:-https://n8n.iorana.dev/webhook/twilio-whatsapp-envio}
      - N8N_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET}
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - coolify
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.io-prospector-web.rule=Host(`pros.iorana.dev`)"
      - "traefik.http.routers.io-prospector-web.entrypoints=https"
      - "traefik.http.routers.io-prospector-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.io-prospector-web-service.loadbalancer.server.port=3004"

networks:
  coolify:
    external: true
  default:
    driver: bridge
